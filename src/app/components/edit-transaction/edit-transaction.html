<div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6">

  <div class="mb-6">
    <p class="mb-2 text-xs font-medium tracking-wider text-violet-400">
      TRANSACTION MANAGEMENT
    </p>
    <h2 class="text-xl font-semibold text-slate-100">
      İşlemi Güncelle
    </h2>
    <p class="mt-1 text-sm text-slate-400">
      İşlem bilgilerini düzenleyebilirsin.
    </p>
  </div>

  <form (ngSubmit)="editTransaction()" class="space-y-5">

    
<!-- Title -->
<div>
  <label class="mb-2 block text-sm font-medium text-slate-300">
    İşlem Açıklaması
  </label>

  <input
    type="text"
    [(ngModel)]="title"
    name="title"
    placeholder="Örn: Market alışverişi"
    class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-600 focus:border-violet-500"
  />
</div>

<!-- Amount -->
<div>
  <label class="mb-2 block text-sm font-medium text-slate-300">
    Tutar (TL)
  </label>

  <input
    type="number"
    [(ngModel)]="amount"
    name="amount"
    placeholder="0"
    class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition placeholder:text-slate-600 focus:border-violet-500"
  />
</div>

<!-- Type -->
<div>
  <label class="mb-2 block text-sm font-medium text-slate-300">
    İşlem Türü
  </label>

  <select
    [(ngModel)]="type"
    name="type"
    class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-violet-500"
  >
    <option value="income">Gelir</option>
    <option value="expense">Gider</option>
  </select>
</div>

<!-- Category -->
<div>
  <label class="mb-2 block text-sm font-medium text-slate-300">
    Kategori
  </label>

  <select
    [(ngModel)]="category"
    name="category"
    class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-violet-500"
  >
    <option value="">Kategori seç</option>
    <option value="Food">Yemek</option>
    <option value="Transport">Ulaşım</option>
    <option value="Salary">Maaş</option>
    <option value="Entertainment">Eğlence</option>
  </select>
</div>

<button
  type="submit"
  class="w-full rounded-xl bg-violet-600 px-4 py-3 font-medium text-white transition hover:bg-violet-500 active:scale-[0.98]"
>
  Değişiklikleri Kaydet
</button>


  </form>

@if (errorMessage) { <p class="mt-4 rounded-lg border border-rose-500/20 bg-rose-500/10 p-3 text-sm text-rose-400">
{{ errorMessage }} </p>
}

</div>
